<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-label="Vertex — the IDE that lives in your browser tab">
  <defs>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="72%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="92%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.5" />
    </pattern>
    <clipPath id="card">
      <rect width="1080" height="380" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1080" height="380" fill="#ffffff" />
    <rect width="1080" height="380" fill="url(#grid)" />
    <rect width="1080" height="380" fill="url(#glow)" />
    <rect width="1080" height="380" fill="url(#glow2)" />

    <!-- logo mark -->
    <g transform="translate(84, 96) scale(5.2)">
      <rect x="2" y="2" width="28" height="28" rx="7" fill="#0f172a" />
      <path d="M8 9L16 23L24 9" stroke="url(#mark)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="16" cy="23" r="2.6" fill="#ffffff" />
      <circle cx="16" cy="23" r="1.5" fill="#818cf8" />
    </g>

    <!-- wordmark + copy -->
    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
      <text x="330" y="152" fill="url(#wordmark)" font-size="86" font-weight="700" letter-spacing="10">VERTEX</text>
      <text x="334" y="204" fill="#4338ca" font-size="22" font-weight="600" letter-spacing="4.5">THE IDE THAT LIVES IN A BROWSER TAB</text>
      <text x="334" y="252" fill="#475569" font-size="23" font-weight="400">Clone any GitHub repo. Edit, build, preview, deploy — zero install.</text>

      <!-- chips -->
      <g font-size="17" font-weight="600">
        <rect x="334" y="284" width="120" height="38" rx="19" fill="#4f46e5" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.5" />
        <text x="394" y="309" fill="#4338ca" text-anchor="middle">Browser</text>

        <rect x="466" y="284" width="120" height="38" rx="19" fill="#4f46e5" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.5" />
        <text x="526" y="309" fill="#4338ca" text-anchor="middle">Desktop</text>

        <rect x="598" y="284" width="188" height="38" rx="19" fill="#4f46e5" fill-opacity="0.08" stroke="#6366f1" stroke-opacity="0.5" />
        <text x="692" y="309" fill="#4338ca" text-anchor="middle">Web Component</text>

        <rect x="798" y="284" width="152" height="38" rx="19" fill="#06b6d4" fill-opacity="0.10" stroke="#06b6d4" stroke-opacity="0.5" />
        <text x="874" y="309" fill="#0e7490" text-anchor="middle">Local-first</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1079" height="379" rx="20" fill="none" stroke="#e2e8f0" stroke-width="1" />
  </g>
</svg>
