<div class="sidebar-container vx-h-full vx-w-full vx-flex vx-flex-col">
  <!-- Sidebar Header -->
  <div class="sidebar-header-vx vx-flex vx-items-center vx-justify-between">
    <div class="vx-flex vx-items-center vx-gap-2">
      <i class="pi pi-bars text-[12px] text-[var(--p-surface-400)]"></i>
      <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-[var(--p-surface-200)] antialiased">Explorer</span>
    </div>
    <div class="vx-flex vx-items-center vx-gap-1">
      <button
        class="p-1 hover:vx-bg-800 rounded text-[var(--p-surface-400)] hover:text-[var(--p-surface-100)] transition-all vx-flex vx-items-center vx-justify-center"
        (click)="newFile.emit()"
        title="New File"
      >
        <i class="pi pi-file-plus text-[11px]"></i>
      </button>
      <button
        class="p-1 hover:vx-bg-800 rounded text-[var(--p-surface-400)] hover:text-[var(--p-surface-100)] transition-all vx-flex vx-items-center vx-justify-center"
        (click)="newFolder.emit()"
        title="New Folder"
      >
        <i class="pi pi-folder-plus text-[11px]"></i>
      </button>
      <button
        class="p-1 hover:vx-bg-800 rounded text-[var(--p-surface-400)] hover:text-[var(--p-surface-100)] transition-all vx-flex vx-items-center vx-justify-center"
        (click)="refresh.emit()"
        title="Refresh"
      >
        <i class="pi pi-refresh text-[11px]"></i>
      </button>
    </div>
  </div>
  
  <!-- File Tree -->
  <div class="sidebar-content vx-flex-1 overflow-auto custom-scrollbar-vx">
    <p-tree 
      [value]="treeNodes" 
      selectionMode="single" 
      [(selection)]="selectedNode"
      (onNodeSelect)="onNodeSelect($event)"
      (onNodeExpand)="onNodeExpand($event)"
      (onNodeCollapse)="onNodeCollapse($event)"
      class="w-full border-none p-0"
      [scrollHeight]="'100%'"
    >
      <ng-template let-node pTemplate="default">
        <div class="vx-flex vx-items-center vx-gap-2 py-0.5 vx-w-full vx-overflow-hidden">
          <i [class]="node.data.customIcon + ' text-[13px] opacity-70 shrink-0'"></i>
          <span class="text-[12px] tracking-tight vx-truncate">{{node.label}}</span>
        </div>
      </ng-template>
    </p-tree>
  </div>
</div>
