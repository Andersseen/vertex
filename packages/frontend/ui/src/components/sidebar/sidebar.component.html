<div class="sidebar">
  <!-- Sidebar Header -->
  <header class="sidebar__header">
    <div class="sidebar__title-group">
      <i class="sidebar__icon pi pi-bars"></i>
      <span class="sidebar__title">Explorer</span>
    </div>

    <div class="sidebar__actions">
      <button
        class="sidebar__action-btn"
        type="button"
        (click)="createNewFile()"
        title="New File"
      >
        <i class="pi pi-file-plus"></i>
      </button>
      <button
        class="sidebar__action-btn"
        type="button"
        (click)="createNewFolder()"
        title="New Folder"
      >
        <i class="pi pi-folder-plus"></i>
      </button>
      <button
        class="sidebar__action-btn"
        type="button"
        (click)="refreshExplorer()"
        title="Refresh"
      >
        <i class="pi pi-refresh"></i>
      </button>
    </div>
  </header>

  <!-- Sidebar Content -->
  <div class="sidebar__content">
    <p-tree
      [value]="treeNodes()"
      selectionMode="single"
      [(selection)]="selectedNode"
      (onNodeSelect)="selectNodeOrToggleFolder($event)"
      (onNodeExpand)="expandFolder($event)"
      (onNodeCollapse)="collapseFolder($event)"
    >
      <ng-template let-node pTemplate="default">
        <div class="sidebar__tree-item">
          <i [class]="node.data.customIcon + ' sidebar__tree-icon'"></i>
          <span class="sidebar__tree-label">{{ node.label }}</span>
        </div>
      </ng-template>
    </p-tree>
  </div>
</div>
