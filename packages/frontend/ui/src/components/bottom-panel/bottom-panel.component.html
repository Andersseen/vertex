<div class="bottom-panel h-full flex-col-vx font-mono">
  <div class="bottom-panel-header flex-vx items-center-vx justify-between-vx shrink-0">
    <div class="flex-vx items-center-vx h-full-vx gap-0">
      <button
        *ngFor="let tab of tabs; let i = index"
        (click)="activeTabIndex = i"
        [class.active]="activeTabIndex === i"
        class="tab-item h-full-vx flex-vx items-center-vx"
      >
        <span class="tab-label">{{ tab }}</span>
      </button>
    </div>
    
    <div
      class="flex-vx items-center-vx px-4 gap-3 text-[10px] text-[var(--p-surface-400)] font-bold uppercase tracking-widest h-full-vx"
    >
      <span class="opacity-60">Terminal</span>
      <button class="hover:text-[var(--p-surface-100)] transition-all flex-vx items-center-vx justify-center-vx p-1 rounded hover:bg-[var(--p-surface-800)]">
        <i class="pi pi-times text-[9px]"></i>
      </button>
    </div>
  </div>

  <div class="bottom-panel-content flex-1-vx overflow-auto p-3">
    <!-- Problems Tab -->
    <div *ngIf="activeTabIndex === 0" class="console-content-vx animate-fade-in">
      <div
        *ngFor="let prob of problems"
        class="flex-vx items-start-vx gap-vx py-1 hover:bg-[var(--p-surface-800)] px-2 rounded cursor-pointer transition-colors prob-item"
      >
        <i
          [class]="
            prob.type === 'error'
              ? 'pi pi-times-circle text-red-400'
              : 'pi pi-exclamation-triangle text-amber-400'
          "
          class="text-[12px] mt-0.5"
        ></i>
        <div class="flex-1-vx">
          <span class="text-[12px] text-[var(--p-surface-300)]">{{
            prob.message
          }}</span>
          <span class="text-[10px] text-[var(--p-surface-500)] ml-2"
            >{{ prob.file }}:{{ prob.line }}</span
          >
        </div>
      </div>
      <div
        *ngIf="problems.length === 0"
        class="text-[12px] text-[var(--p-surface-500)] p-2"
      >
        No problems detected
      </div>
    </div>

    <!-- Output Tab -->
    <div *ngIf="activeTabIndex === 1" class="console-content-vx animate-fade-in">
      <div *ngFor="let out of output" class="py-0.5">
        <span
          [class]="
            out.type === 'success'
              ? 'text-green-400'
              : out.type === 'warning'
                ? 'text-amber-400'
                : 'text-[var(--p-surface-400)]'
          "
          class="text-[11px] font-mono"
          >{{ out.text }}</span
        >
      </div>
    </div>

    <!-- Debug Console Tab -->
    <div *ngIf="activeTabIndex === 2" class="console-content-vx animate-fade-in">
      <div *ngFor="let dbg of debugConsole" class="py-0.5">
        <span
          [class]="
            dbg.type === 'success'
              ? 'text-green-400'
              : dbg.type === 'warning'
                ? 'text-amber-400'
                : 'text-blue-400'
          "
          class="text-[11px] font-mono"
          >{{ dbg.text }}</span
        >
      </div>
    </div>

    <!-- Terminal Tab -->
    <div *ngIf="activeTabIndex === 3" class="console-content-vx animate-fade-in">
      <div *ngFor="let term of terminal" class="py-0.5">
        <span class="text-[11px] font-mono text-[var(--p-surface-300)]">{{
          term.text
        }}</span>
      </div>
      <div class="flex-vx items-center-vx gap-vx mt-2">
        <span class="text-[11px] text-[var(--p-primary-500)]">➜</span>
        <span
          class="text-[11px] font-mono text-[var(--p-surface-400)] animate-pulse"
          >_</span
        >
      </div>
    </div>
  </div>
</div>
