<div class="editor">
  @if (showHeader()) {
    <!-- Editor Header -->
    <header class="editor__header">
      <div class="editor__tab">
        <i class="editor__tab-icon" [class]="getFileIcon(file()?.language)"></i>
        <span class="editor__tab-name">{{ file()?.name ?? "Untitled" }}</span>
        @if (isDirty) {
          <span class="editor__modified-indicator" title="Modified"></span>
        }
        <button class="editor__close-btn" type="button" aria-label="Close file">
          <i class="pi pi-times"></i>
        </button>
      </div>

      <div class="editor__actions">
        <span class="editor__language">{{ file()?.language ?? "text" }}</span>
        <button
          class="editor__save-btn"
          type="button"
          (click)="saveFile()"
          [disabled]="!isDirty"
        >
          <i class="pi pi-save"></i>
          <span>Save</span>
        </button>
      </div>
    </header>
  }

  <!-- Editor Content -->
  <div #editorHost class="editor__host"></div>
</div>
