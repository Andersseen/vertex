<div class="tabs">
  <div class="tabs__header">
    @for (file of files(); track file.id) {
      <div
        class="tabs__item"
        [class.tabs__item--active]="file.id === activeFileId()"
        (click)="selectTab(file)"
      >
        <i
          class="tabs__icon"
          [style.color]="getIconColor(file.language)"
        >{{ getFileIcon(file.language) }}</i>
        <span class="tabs__name">{{ file.name }}</span>

        @if (file.isDirty) {
          <span class="tabs__modified"></span>
        }

        @if (files().length > 1) {
          <button
            class="tabs__close"
            type="button"
            (click)="closeTab(file, $event)"
            aria-label="Close tab"
          >
            <span aria-hidden="true">×</span>
          </button>
        }
      </div>
    }
    <button
      class="tabs__new"
      type="button"
      (click)="createNewTab()"
      aria-label="New tab"
    >
      <span aria-hidden="true">+</span>
    </button>
  </div>
</div>
