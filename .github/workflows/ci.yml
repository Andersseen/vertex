name: CI

# Single pipeline for the whole monorepo:
#   quality -> e2e
#           -> deploy web (Cloudflare Pages, main only)
#           -> deploy docs (Cloudflare Pages, main only)
#
# Cloudflare is the one and only deploy target. See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"
  # Keep in sync with the root `wrangler` devDependency.
  WRANGLER_VERSION: "4.114.0"
  CF_PAGES_PROJECT: vertex-web
  CF_DOCS_PAGES_PROJECT: vertex-docs
  PRODUCTION_URL: https://vertex.andersseen.dev
  DOCS_PRODUCTION_URL: https://vertex-docs.pages.dev

jobs:
  quality:
    name: Lint · Types · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Lint
        run: bun run lint

      - name: Package boundaries
        run: bun run check:boundaries

      - name: Typecheck
        run: bun run check-types

      - name: Unit tests
        run: bun test

      - name: Build documentation
        run: bun run docs:build

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: vertex-docs-dist
          path: apps/docs/dist
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E · Playwright
    needs: quality
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build web app
        run: bun run web:build

      - name: Resolve Playwright version
        id: playwright-version
        working-directory: apps/web
        run: echo "PLAYWRIGHT_VERSION=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy · Cloudflare Pages
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://vertex.andersseen.dev
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build web app
        timeout-minutes: 10
        run: bun run web:build

      - name: Publish to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: apps/web
          command: pages deploy dist/client --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main

      - name: Deployment summary
        run: |
          {
            echo "### 🚀 Deployed to Cloudflare Pages"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Production | ${PRODUCTION_URL} |"
            echo "| Build alias | ${DEPLOYMENT_URL:-—} |"
            echo "| Project | \`${CF_PAGES_PROJECT}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}

  deploy-docs:
    name: Deploy docs · Cloudflare Pages
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: documentation
      url: https://vertex-docs.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download tested documentation
        uses: actions/download-artifact@v4
        with:
          name: vertex-docs-dist
          path: apps/docs/dist

      - name: Publish documentation to Cloudflare Pages
        id: cloudflare-docs
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: bun
          workingDirectory: apps/docs
          command: pages deploy dist --project-name=${{ env.CF_DOCS_PAGES_PROJECT }} --branch=main

      - name: Documentation deployment summary
        run: |
          {
            echo "### 📚 Documentation deployed to Cloudflare Pages"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Production | ${DOCS_PRODUCTION_URL} |"
            echo "| Build alias | ${DEPLOYMENT_URL:-—} |"
            echo "| Project | \`${CF_DOCS_PAGES_PROJECT}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare-docs.outputs.deployment-url }}
