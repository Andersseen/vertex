<v-main-layout (openFolder)="openFolder()" (cloneRepo)="openCloneDialog()">
  <!-- Left Sidebar: File Explorer -->
  <v-sidebar
    sidebar
    [workspaceFolder]="rootFolder()"
    [activeFileId]="activeFileId()"
    (fileSelect)="onFileSelect($event)"
    (folderToggle)="onFolderToggle($event)"
    (newFile)="onNewFile()"
    (newFolder)="onNewFolder()"
    (rename)="onRename()"
    (delete)="onDelete()"
  ></v-sidebar>

  <!-- Main Editor Area (with optional Preview split) -->
  <div editor class="vx-flex vx-flex-col vx-h-full vx-overflow-hidden vx-bg-950">
    <!-- Tab Bar -->
    <v-tabs
      [files]="openFiles()"
      [activeFileId]="activeFileId()"
      (tabSelect)="onTabSelect($event)"
      (tabClose)="onTabClose($event)"
      (newTab)="onNewFile()"
    >
    </v-tabs>

    <!-- Editor + Preview split -->
    <div class="vx-flex-1 vx-overflow-hidden vx-flex" style="position: relative;">
      @if (showPreview()) {
        <v-ide-splitter
          storageKey="vertex:layout:preview"
          [defaultPosition]="55"
          [minSize]="20"
          [maxSize]="80"
          class="vx-flex-1"
        >
          <div splitterStart class="vx-h-full vx-overflow-hidden">
            <v-editor
              [file]="activeFile()"
              [showHeader]="false"
              [extensions]="editorExtensions()"
              (contentChange)="onContentChange($event)"
              (save)="onSave()"
            ></v-editor>
          </div>
          <div splitterEnd class="vx-h-full vx-overflow-hidden">
            <app-preview-panel [virtualFs]="runtime.fs"></app-preview-panel>
          </div>
        </v-ide-splitter>
      } @else {
        <v-editor
          [file]="activeFile()"
          [showHeader]="false"
          [extensions]="editorExtensions()"
          (contentChange)="onContentChange($event)"
          (save)="onSave()"
          class="vx-flex-1"
        ></v-editor>
      }

      <!-- Preview toggle button (top-right corner) -->
      <button
        class="vx-preview-toggle"
        (click)="showPreview.set(!showPreview())"
        [title]="showPreview() ? 'Hide Preview' : 'Show Preview'"
      >
        @if (showPreview()) {
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 8l4 4-4 4"/>
            <path d="M3 12h18"/>
          </svg>
        } @else {
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="18" rx="2"/>
            <path d="M9 3v18"/>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Bottom Panel Slot -->
  <v-bottom-panel bottom [workspacePath]="workspacePath()"></v-bottom-panel>
</v-main-layout>

<!-- Clone Repository Dialog -->
<app-clone-dialog
  [visible]="showCloneDialog()"
  [urlPreset]="cloneUrlPreset()"
  (visibleChange)="showCloneDialog.set($event)"
  (cloneSuccess)="onCloneSuccess($event)"
/>

<!-- Open Folder Dialog -->
<app-prompt-dialog
  [visible]="showOpenFolderDialog()"
  title="Open Folder"
  message="Enter absolute path to workspace folder:"
  [value]="openFolderPreset()"
  confirmLabel="Open"
  (visibleChange)="showOpenFolderDialog.set($event)"
  (confirmValue)="onOpenFolderConfirm($event)"
/>

<!-- New File Dialog -->
<app-prompt-dialog
  [visible]="showNewFileDialog()"
  title="New File"
  message="Enter file name:"
  placeholder="example.ts"
  [value]="newFilePreset()"
  confirmLabel="Create"
  (visibleChange)="showNewFileDialog.set($event)"
  (confirmValue)="onNewFileConfirm($event)"
/>

<!-- New Folder Dialog -->
<app-prompt-dialog
  [visible]="showNewFolderDialog()"
  title="New Folder"
  message="Enter folder name:"
  placeholder="src"
  [value]="newFolderPreset()"
  confirmLabel="Create"
  (visibleChange)="showNewFolderDialog.set($event)"
  (confirmValue)="onNewFolderConfirm($event)"
/>

<!-- Rename Dialog -->
<app-prompt-dialog
  [visible]="showRenameDialog()"
  title="Rename"
  message="Enter new name:"
  [value]="renamePreset()"
  confirmLabel="Rename"
  (visibleChange)="showRenameDialog.set($event)"
  (confirmValue)="onRenameConfirm($event)"
/>

<!-- Delete Confirm Dialog -->
<app-confirm-dialog
  [visible]="showDeleteConfirmDialog()"
  title="Delete"
  [message]="deleteConfirmMessage()"
  confirmLabel="Delete"
  (visibleChange)="showDeleteConfirmDialog.set($event)"
  (confirmed)="onDeleteConfirm()"
/>

<!-- Toast notifications -->
<v-ide-toaster />
