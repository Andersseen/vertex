<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vertex IDE</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.svg" />
    <style>
      :root {
        --surface: #1e1e1e;
        --surface-hover: #2d2d2d;
        --surface-active: #3a3a3a;
        --border: #333333;
        --text: #cccccc;
        --text-muted: #888888;
        --primary: #667eea;
        --primary-hover: #5a6fd8;
        --selection: rgba(102, 126, 234, 0.3);
        --selection-focused: rgba(102, 126, 234, 0.5);
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--surface);
        color: var(--text);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
