<v-main-layout (openFolder)="openFolder()">
  <v-sidebar
    sidebar
    [workspaceFolder]="rootFolder()"
    [activeFileId]="activeFileId()"
    (fileSelect)="onFileSelect($event)"
    (folderToggle)="onFolderToggle($event)"
  >
  </v-sidebar>

  <div editor class="editor-area">
    <v-tabs
      [files]="openFiles()"
      [activeFileId]="activeFileId()"
      (tabSelect)="onTabSelect($event)"
      (tabClose)="onTabClose($event)"
      (newTab)="onNewTab()"
    ></v-tabs>

    <v-editor
      [file]="activeFile()"
      [showHeader]="false"
      (contentChange)="onContentChange($event)"
      (save)="onSave()"
    ></v-editor>
  </div>

  <v-bottom-panel bottom [workspacePath]="rootFolder()?.path || ''"></v-bottom-panel>
</v-main-layout>
